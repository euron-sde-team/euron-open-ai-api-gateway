name: Bug report
description: Something does not work as documented.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. **Security issues: do not file here**, follow SECURITY.md instead.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead. Say which role you were (developer or admin), which endpoint you called (/v1/chat/completions, /v1/messages, ...) and, for model problems, which provider and model (a real one or a local stub).
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. make up && make demo
        2. curl http://localhost:5056/v1/chat/completions -H "Authorization: Bearer <demo key>" ...
        3. ...
    validations:
      required: true
  - type: dropdown
    id: env
    attributes:
      label: Environment
      options: ["Local (make up on Floci)", "Local against AWS (make up-aws)", "AWS (Terraform)", "Self-hosted (other)", "Other"]
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: ["Gateway (/v1: OpenAI or Anthropic compatible)", "Streaming (SSE)", "Models, providers and routing", "API keys and rate limits", "Billing, top-ups and payments (Stripe, Razorpay)", "Usage and analytics", "Developer console", "Account and sign-in", "Admin console (/admin)", "Email", "Deployment and infrastructure", "Other"]
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version / commit
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Redact keys, tokens and hostnames before pasting.
      render: text

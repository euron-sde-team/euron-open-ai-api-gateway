# ─────────────────────────────────────────────────────────────────────────────
# Euron Open AI API Gateway: local stack (cloud-agnostic base).
#
# Never run this file alone. Pair it with a cloud overlay:
#   make up        # = compose.yaml + compose.floci.yaml  (emulated AWS, no account needed)
#   make up-aws    # = compose.yaml + compose.aws.yaml    (real AWS resources)
#
# On its own the base sends mail straight to Mailpit (MAIL_MODE=smtp); the overlays
# switch it to SES (emulated by Floci, or real).
#
# Secrets come from deploy/compose/.env, generated by `make env`
# (scripts/gen-local-env.sh). They are random, local-only throwaways. `make up-aws`
# also reads deploy/compose/.env.aws, whose values win over the defaults here.
#
# Host ports (override in .env, or in your shell, if they clash with something else):
#   web 3560   api 5056   postgres 5522   redis 6459   mailpit 8076 (smtp 1076)
#   floci 4627   stubs 5149
#
# The browser only ever talks to the web app: it proxies /api/* (console API) and
# /v1/* (the gateway) to the API (API_INTERNAL_URL), so the refresh cookie is
# first-party, exactly as behind the load balancer on AWS. The API port is published
# too: point an SDK at http://localhost:5056/v1 directly.
#
# No real account is needed anywhere. Outside production the API creates a starter
# catalogue whose providers are the stubs container (apps/stubs: fake OpenAI-compatible
# and Anthropic endpoints), and both payment gateways point at the stubs' fake Stripe
# and Razorpay. Real provider keys are added by an admin in /admin, never in this file.
# ─────────────────────────────────────────────────────────────────────────────
name: open-gateway

# Every value an overlay or an env file may want to change is a ${NAME:-default}
# interpolation under the variable's own name, so `--env-file .env.aws` (make up-aws)
# and your shell can set it; the overlays then set their own values on top. Precedence,
# highest first: an overlay's `environment:`, your shell, the last --env-file
# (.env.aws for up-aws, then .env), the default below. Keys the base does not set at
# all (SES_CONFIGURATION_SET, ...) also reach the containers through the overlay's
# `env_file:`.
x-api-env: &api-env
  # Development mode keeps the production guards as warnings: the local stack talks to
  # an emulator and links to localhost, both of which production refuses on purpose.
  NODE_ENV: development
  TZ: UTC
  PORT: "5056"
  LOG_LEVEL: ${LOG_LEVEL:-${GW_LOG_LEVEL:-info}}
  PRODUCT_NAME: ${PRODUCT_NAME:-${GW_PRODUCT_NAME:-Euron Open AI API Gateway}}
  APP_WEB_URL: http://localhost:${GW_WEB_PORT:-3560}
  # Same origin as the web app: the browser reaches the API through the web proxy.
  PUBLIC_API_URL: http://localhost:${GW_WEB_PORT:-3560}
  CORS_ORIGINS: http://localhost:${GW_WEB_PORT:-3560}
  TRUST_PROXY: "1"
  DATABASE_URL: postgres://gw:gw@postgres:5432/gw
  DB_POOL_MAX: ${DB_POOL_MAX:-10}
  # Migrations run once, in the `migrate` one-shot, before the API and worker start.
  MIGRATE_ON_BOOT: "false"
  REDIS_URL: redis://redis:6379
  JOBS_MODE: queue
  JWT_SECRET: ${GW_JWT_SECRET:?run `make env` first}
  REFRESH_SECRET: ${GW_REFRESH_SECRET:?run `make env` first}
  # 32 random bytes, base64: encrypts stored TOTP secrets. `make env` adds it to an
  # existing .env as well.
  TOTP_ENCRYPTION_KEY: ${GW_TOTP_ENCRYPTION_KEY:?run `make env` first}
  # 32 random bytes, base64: encrypts the provider credentials admins enter in /admin.
  CREDENTIALS_KEY: ${GW_CREDENTIALS_KEY:?run `make env` first}
  # The HMAC pepper API keys are hashed with. Changing it invalidates every issued key.
  API_KEY_PEPPER: ${GW_API_KEY_PEPPER:?run `make env` first}
  API_KEY_PREFIX: ${API_KEY_PREFIX:-gw-}
  COOKIE_SECURE: "false"
  REQUIRE_EMAIL_VERIFICATION: ${REQUIRE_EMAIL_VERIFICATION:-true}
  DATA_DIR: /app/data
  MAIL_MODE: ${MAIL_MODE:-smtp}
  MAIL_FROM: ${MAIL_FROM:-${GW_PRODUCT_NAME:-Euron Open AI API Gateway} <no-reply@gateway.example.test>}
  SMTP_HOST: ${SMTP_HOST:-mailpit}
  SMTP_PORT: ${SMTP_PORT:-1025}
  # What the console shows developers as the SDK base URL (the API's own port).
  GATEWAY_PUBLIC_URL: ${GATEWAY_PUBLIC_URL:-http://localhost:${GW_API_PORT:-5056}/v1}
  GATEWAY_MAX_BODY_MB: ${GATEWAY_MAX_BODY_MB:-20}
  GATEWAY_MAX_AUDIO_MB: ${GATEWAY_MAX_AUDIO_MB:-25}
  # Where providers of kind STUB (the starter catalogue) live.
  STUBS_URL: ${STUBS_URL:-http://stubs:5149}
  # Both payment gateways against the stubs, with obviously fake keys. The webhook
  # secrets match what the stubs container signs with (x-stub-secrets below).
  STRIPE_API_BASE: ${STRIPE_API_BASE:-http://stubs:5149/stripe}
  STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-sk_test_local_stub}
  STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-whsec_local_stub}
  RAZORPAY_API_BASE: ${RAZORPAY_API_BASE:-http://stubs:5149/razorpay}
  RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-rzp_test_local_stub}
  RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-rzp_secret_local_stub}
  RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET:-rzp_whsec_local_stub}
  # A "confirm" button for top-ups in the console. Development only: refused in production.
  PAYMENTS_STUB: ${PAYMENTS_STUB:-true}
  # INR per USD: fixed locally so the demo needs no network.
  FX_PROVIDER: ${FX_PROVIDER:-fixed}
  FX_FIXED_INR_PER_USD: ${FX_FIXED_INR_PER_USD:-85}

# The secrets the stubs sign fake webhooks with; the API verifies them with the same values.
x-stub-secrets: &stub-secrets
  STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-whsec_local_stub}
  RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-rzp_secret_local_stub}
  RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET:-rzp_whsec_local_stub}

# api, worker and migrate are one image with three commands. Each carries the same build
# so any of them can be started alone; BuildKit builds it once and reuses the cache.
x-api-build: &api-build
  context: ../..
  dockerfile: infra/docker/api.Dockerfile

services:
  postgres:
    image: postgres:16.12-alpine
    environment:
      POSTGRES_DB: gw
      POSTGRES_USER: gw
      POSTGRES_PASSWORD: gw
    ports:
      - "127.0.0.1:${GW_PG_PORT:-5522}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gw -d gw"]
      interval: 3s
      timeout: 3s
      retries: 30

  # BullMQ (scheduled jobs) and rate limits. A plain container in
  # every local setup; ElastiCache (infra/terraform/modules/cache) on AWS.
  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:${GW_REDIS_PORT:-6459}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 30

  # Every mail the stack sends lands here (directly with MAIL_MODE=smtp, or relayed by
  # the emulator's SES with MAIL_MODE=ses). Web UI: http://localhost:8076
  mailpit:
    image: axllent/mailpit:v1.27.9
    ports:
      - "127.0.0.1:${GW_MAILPIT_PORT:-8076}:8025"
      # SMTP, for MAIL_MODE=smtp (the integration matrix sends straight to it).
      - "127.0.0.1:${GW_SMTP_PORT:-1076}:1025"

  # Deterministic stand-ins for the upstream providers (OpenAI-compatible /v1/*,
  # Anthropic /anthropic/v1/*) and the payment gateways (/stripe/v1/*, /razorpay/v1/*)
  # (apps/stubs). GET http://localhost:5149/__/requests lists what the API sent it.
  stubs:
    build:
      context: ../..
      dockerfile: infra/docker/stubs.Dockerfile
    image: open-gateway-stubs:local
    environment:
      <<: *stub-secrets
      PORT: "5149"
      # The fake Stripe checkout page is opened by the browser, then returns to the console.
      STUBS_PUBLIC_URL: http://localhost:${GW_STUB_PORT:-5149}
      APP_WEB_URL: http://localhost:${GW_WEB_PORT:-3560}
      # Where the checkout page delivers the signed Stripe webhook after "Pay".
      STUBS_API_URL: http://api:5056
    ports:
      - "127.0.0.1:${GW_STUB_PORT:-5149}:5149"
    restart: unless-stopped

  # One-shot: apply db/migrations, then exit 0. The API and worker wait for it.
  migrate:
    build: *api-build
    image: open-gateway-api:local
    command: ["node", "--enable-source-maps", "dist/migrate.js"]
    environment:
      <<: *api-env
    healthcheck:
      disable: true
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build: *api-build
    image: open-gateway-api:local
    # A model server on the host (Ollama, LM Studio) answers at http://host.docker.internal:<port>, on Linux too.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: ["node", "--enable-source-maps", "dist/index.js"]
    environment:
      <<: *api-env
    ports:
      - "127.0.0.1:${GW_API_PORT:-5056}:5056"
    volumes:
      - appdata:/app/data
    tmpfs:
      - /tmp:uid=1000,gid=1000
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      # The starter catalogue's providers and both fake payment gateways.
      stubs:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build: *api-build
    image: open-gateway-api:local
    # A model server on the host (Ollama, LM Studio) answers at http://host.docker.internal:<port>, on Linux too.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: ["node", "--enable-source-maps", "dist/worker.js"]
    environment:
      <<: *api-env
    volumes:
      - appdata:/app/data
    tmpfs:
      - /tmp:uid=1000,gid=1000
    # No HTTP port: the image's /up check does not apply.
    healthcheck:
      disable: true
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: ../..
      dockerfile: infra/docker/web.Dockerfile
      args:
        API_INTERNAL_URL: http://api:5056
    image: open-gateway-web:local
    environment:
      # Server side only: where the Next server proxies /api/* and /v1/*.
      API_INTERNAL_URL: http://api:5056
      PRODUCT_NAME: ${PRODUCT_NAME:-${GW_PRODUCT_NAME:-Euron Open AI API Gateway}}
    ports:
      - "127.0.0.1:${GW_WEB_PORT:-3560}:3000"
    depends_on:
      api:
        condition: service_started
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  appdata:
